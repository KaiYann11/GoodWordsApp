<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 글귀 서버</title>
  <link rel="icon" href="/app-icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/app-icon.svg" alt="" width="36" height="36">
      <div>
        <h1>오늘의 글귀</h1>
        <p id="connectionText">서버 연결 중</p>
      </div>
    </div>
    <button id="refreshButton" class="iconButton" type="button" title="새로고침">↻</button>
  </header>

  <nav class="tabs" aria-label="주요 메뉴">
    <button class="tab active" type="button" data-tab="home">홈</button>
    <button class="tab" type="button" data-tab="library">보관함</button>
    <button class="tab" type="button" data-tab="routines">루틴</button>
    <button class="tab" type="button" data-tab="todos">할 일</button>
    <button class="tab" type="button" data-tab="diaries">일기</button>
    <button class="tab" type="button" data-tab="books">독서</button>
    <button class="tab" type="button" data-tab="history">이력</button>
    <button class="tab" type="button" data-tab="settings">서버</button>
  </nav>

  <main id="app" class="appShell"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="snapshotFile" class="hidden" type="file" accept="application/json">

  <script type="module" src="/app.js"></script>
</body>
</html>
